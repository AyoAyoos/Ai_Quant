name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Address-space cap for the worker; pandas cannot import below ~1.5GB.
      SANDBOX_MEMORY_MB: 2048
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          if swapon --show | grep -q .; then
            echo "swap already active"; swapon --show
          else
            sudo rm -f /ci-swapfile
            sudo dd if=/dev/zero of=/ci-swapfile bs=1M count=4096 status=none \
              || sudo fallocate -l 4G /ci-swapfile
            sudo chmod 600 /ci-swapfile
            sudo mkswap /ci-swapfile
            sudo swapon /ci-swapfile
          fi
          free -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
