    <title>Quant Strategy Assistant — conversational NIFTY 50 strategy research</title>
    <meta
      name="description"

    <meta property="og:type" content="website" />

      name="twitter:description"

    />

    <!--
      Material Symbols is a ligature font loaded from the Google Fonts CDN: the
      <span class="ms">chat</span> markup swaps its text for a glyph at paint
      time. If the request is blocked the literal word renders instead, so every
      icon in the app is decorative (aria-hidden) and never load-bearing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
