# nginx config for the built SPA.
#
# The single job of this file beyond static hosting is the SPA fallback: this is
# a client-side router, so a hard reload or a shared link on /chat or
# /strategies/:id must return index.html and let React Router resolve the path.
# Without `try_files`, nginx answers those URLs with a bare 404 and the app
# looks broken even though every asset is present.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived, content-hashed bundles are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed favicon and any other root-level static file: serve directly.
    location ~* \.(?:ico|png|svg|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers pinned to a
    # stale bundle that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback — everything else is a client route.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server_tokens off;
}
